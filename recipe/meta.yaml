{% set versions = {
    "2.0.9": "6ffbd371658726054b903dce9a7855ac02b258eac59e2ee13524dda9e278f23b"
} %}


{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', "qcdloop")|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://github.com/scarrazza/qcdloop/archive/refs/tags/{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}


build:
  # aarch64 previously skipped: src/qcdloop/types.h hard-includes <quadmath.h>
  # for its extended-precision "qdouble" type, and conda-forge's aarch64 GCC
  # doesn't ship libquadmath (it is x86-only, because there long double is the
  # 80-bit x87 format and a separate 128-bit type is therefore needed).
  #
  # No rewrite was needed after all. On aarch64 `long double` IS IEEE 754
  # binary128 -- the identical format __float128 provides -- so the quad
  # arithmetic is already present in libm under the long double names. A
  # header-only shim (recipe/quadmath-shim.h) supplies GCC's `*q` spelling on
  # top of it; see build.sh. Precision is unchanged, and the accompanying
  # patch is inert on x86.
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('gfortran') }}
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}

    - cmake
    - make
    - sed        # build.sh's `sed -i` needs GNU semantics; BSD sed on macOS differs

about:
  home: "https://github.com/scarrazza/qcdloop"
  license: "GPL-3.0"
  summary: "Object-oriented one-loop scalar Feynman integrals framework"

extra:
  recipe-maintainers:
    - meiyasan
